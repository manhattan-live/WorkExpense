services:
  postgres:
    image: postgres:15
    container_name: expenses_db
    environment:
      POSTGRES_DB: expenses_db
      POSTGRES_USER: expenses_user
      POSTGRES_PASSWORD: your_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://expenses_user:your_secure_password@expenses_db:5432/expenses_db
    restart: unless-stopped

volumes:
  postgres_data: